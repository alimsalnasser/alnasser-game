<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Barricade Online</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>لعبة الحواجز</h1>
      <div id="status">غير متصل</div>
    </header>

    <section class="join">
      <input id="room" placeholder="رمز الغرفة" value="demo">
      <button id="joinBtn">دخول</button>
      <button id="shareBtn">مشاركة الرابط</button>
    </section>

    <section class="tools">
      <button id="moveMode" class="active">تحريك</button>
      <button id="wallMode">حاجز</button>
      <button id="restartBtn">إعادة</button>
    </section>

    <div id="board" class="board"></div>

    <p class="hint">
      الهدف: الأزرق يصل للأسفل، والأحمر يصل للأعلى. في دورك اختر تحريك أو حاجز ثم اضغط على اللوحة.
    </p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
